# CI da R1: os mesmos sensores do Gate 4, rodando a cada push e pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (PostgreSQL, RTM, auditoria)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdv/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdv
          POSTGRES_PASSWORD: pdv
          POSTGRES_DB: pdv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdv" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pdv:pdv@localhost:5432/pdv_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pdv/api/requirements.lock.txt
      - run: pip install --require-hashes -r requirements.lock.txt
      - run: pip install pytest pytest-cov pip-audit
      - name: Migrações (upgrade, check, downgrade, upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://pdv:pdv@localhost:5432/postgres
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Testes em PostgreSQL
        run: python -m pytest --cov=pdv_api --cov-report=term --cov-fail-under=90 --junitxml=pytest.xml
      - name: Verificador de RTM e arquitetura (ADR-0001)
        run: python scripts/verificar_rtm.py --json rtm.json
      - name: Auditoria de dependências
        run: pip-audit -r requirements.lock.txt --require-hashes --disable-pip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidencias-api
          path: |
            pdv/api/pytest.xml
            pdv/api/rtm.json

  mutacao:
    name: Mutação nos módulos de regra (>= 85%)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mutacao')
    defaults:
      run:
        working-directory: pdv/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pdv/api/requirements.lock.txt
      - run: pip install --require-hashes -r requirements.lock.txt
      - run: pip install pytest "mutmut>=3,<4"
      - run: mutmut run --max-children 4 || true
      - name: Score
        run: mutmut results --all true | python scripts/score_mutacao.py --minimo 85 --json mutacao.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidencias-mutacao
          path: pdv/api/mutacao.json

  gateway:
    name: wa-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdv/wa-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pdv/wa-gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  web:
    name: Painel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdv/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pdv/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit

  stack:
    name: Imagens Docker + e2e no navegador
    runs-on: ubuntu-latest
    needs: [api, gateway, web]
    defaults:
      run:
        working-directory: pdv
    steps:
      - uses: actions/checkout@v7
      - name: Segredos descartáveis
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 12)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "GATEWAY_TOKEN=$(openssl rand -hex 16)"
            echo "PORTA_PAINEL=8080"
          } > .env
      - name: Construir e subir (RT-07)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait --wait-timeout 300
      - name: Fumaça
        run: |
          curl -fsS http://localhost:8080/api/saude
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/canal/webhook)" = "404"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install playwright httpx && python -m playwright install --with-deps chromium
      - name: E2E (cadastro → cardápio → pedido → cozinha → cancelamento)
        run: |
          set -a; . ./.env; set +a
          WEB_URL=http://localhost:8080 API_URL=http://localhost:8000 SHOTS_DIR=e2e-shots python e2e/e2e.py
      - name: Logs sem dados pessoais (RN-10)
        if: always()
        run: |
          docker compose logs --no-color > compose.log
          ! grep -E "5592991234567|5592988887777|Rua 10 de Julho|sem cebola" compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidencias-stack
          path: |
            pdv/e2e-shots
            pdv/compose.log
      - if: always()
        run: docker compose down -v

  producao:
    name: Kit de produção (HTTPS, verificação, backup e restauração)
    runs-on: ubuntu-latest
    needs: [api, gateway, web]
    defaults:
      run:
        working-directory: pdv
    env:
      VERIFICAR_INSEGURO: "1" # DOMINIO=localhost usa a autoridade interna do Caddy
      CONFIRMAR: RESTAURAR
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck -x deploy/pdv.sh web/entrypoint/05-proxy-confiavel.sh
      - name: Instalar como numa VPS
        run: ./deploy/pdv.sh instalar localhost
      - name: Verificar
        run: ./deploy/pdv.sh verificar
      - name: Dados de teste pelo HTTPS
        run: |
          curl -fsSk -X POST https://localhost/api/restaurantes -H 'Content-Type: application/json' \
            -d '{"nome":"Piloto CI","admin_email":"ci@piloto.com","admin_senha":"Forte#2026"}'
          curl -fsSk -X POST https://localhost/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@piloto.com","senha":"Forte#2026"}' > /dev/null
      - name: Backup
        run: ./deploy/pdv.sh backup && ls -l backups
      - name: Apagar tudo e restaurar
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait --wait-timeout 300
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/api/auth/login \
            -H 'Content-Type: application/json' -d '{"email":"ci@piloto.com","senha":"Forte#2026"}')" = "401"
          ./deploy/pdv.sh restaurar backups/pdv-*.dump backups/sessoes-*.tgz
          curl -fsSk -X POST https://localhost/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@piloto.com","senha":"Forte#2026"}' > /dev/null
          ./deploy/pdv.sh verificar
      - name: Relatório do piloto
        run: ./deploy/pdv.sh relatorio 7
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color > producao.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidencias-producao
          path: pdv/producao.log
