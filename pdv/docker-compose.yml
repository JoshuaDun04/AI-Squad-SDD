# PDV Restaurantes — R1. Sobe tudo com: docker compose up -d --build
# Antes, copie .env.example para .env e troque os segredos.
name: pdv-restaurantes

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdv
      POSTGRES_USER: pdv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdv -d pdv"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://pdv:${POSTGRES_PASSWORD}@db:5432/pdv
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (32+ caracteres) no .env}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?defina GATEWAY_TOKEN (16+ caracteres) no .env}
      GATEWAY_URL: http://wa-gateway:3001
      CORS_ORIGENS: ${CORS_ORIGENS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 3s
      retries: 10

  wa-gateway:
    build: ./wa-gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      API_URL: http://api:8000
      DATA_DIR: /data
    volumes:
      - wa-sessoes:/data

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PORTA_PAINEL:-8080}:8080"

volumes:
  db-dados:
  wa-sessoes:
