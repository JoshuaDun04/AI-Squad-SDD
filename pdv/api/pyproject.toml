[project]
name = "pdv-api"
version = "0.1.0"
description = "API do PDV Restaurantes (R1): cardápio, robô de pedidos no WhatsApp e fila da cozinha"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pyjwt>=2.15",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "pydantic>=2.8",
  "email-validator>=2.2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mutmut>=3"]

[tool.setuptools]
packages = ["pdv_api", "pdv_api.dominio", "pdv_api.rotas", "pdv_api.servicos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["bdd(id): cenário BDD coberto pelo teste (ver docs/bdd-r1.md)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mutmut]
# Sensor de mutação nos módulos de regra de negócio (critério do Gate 4: >= 85%)
source_paths = ["pdv_api/dominio/"]
paths_to_mutate = ["pdv_api/dominio/status.py", "pdv_api/dominio/dinheiro.py", "pdv_api/dominio/horario.py", "pdv_api/dominio/lgpd.py", "pdv_api/dominio/robo.py"]
tests_dir = ["tests/"]
pytest_add_cli_args_test_selection = ["tests/test_dominio.py", "tests/test_robo_textos.py", "tests/test_lgpd_logs.py"]
also_copy = ["tests/", "pdv_api/", "migracoes/", "alembic.ini"]
