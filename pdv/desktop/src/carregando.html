<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>PDV Restaurantes</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    font-family: "Segoe UI", system-ui, sans-serif; background: #e9eee8; color: #18211c;
  }
  h1 { font-size: 22px; margin: 0; font-weight: 600; }
  #etapa { font-size: 15px; color: #4d5a52; min-height: 1.4em; }
  .roda {
    width: 34px; height: 34px; border-radius: 50%;
    border: 4px solid #c9d3cb; border-top-color: #173326; animation: gira 0.9s linear infinite;
  }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (prefers-color-scheme: dark) {
    body { background: #173326; color: #ffffff; }
    #etapa { color: #c9d3cb; }
    .roda { border-color: #2c4a3b; border-top-color: #e2b019; }
  }
</style>
</head>
<body>
  <div class="roda" aria-hidden="true"></div>
  <h1>PDV Restaurantes</h1>
  <div id="etapa" role="status">Abrindo…</div>
</body>
</html>
